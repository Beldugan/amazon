<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazonul în 3D · The Amazon in 3D</title>
<style>
  :root{--ink:#173a2a;--card:#fffdf5;--accent:#ff8a3d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc9e6;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#1b5e3a,#154d30);color:#fff;flex-wrap:wrap;z-index:5}
  header h1{font-size:clamp(16px,2.1vw,23px);margin:0 6px 0 0}
  header h1 span{color:#ffd166}
  .btn{border:0;border-radius:999px;padding:7px 13px;font:inherit;font-weight:bold;font-size:clamp(12px,1.3vw,15px);cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);text-decoration:none;display:inline-block}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .btn.on{background:#ffd166}.btn.go{background:var(--accent);color:#fff}
  .meltbox{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;font-weight:bold;font-size:clamp(12px,1.3vw,15px)}
  .meltbox input{width:clamp(80px,12vw,160px);accent-color:#ffd166}
  .meltbox button{border:0;background:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px}
  .lang{margin-left:auto;display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:bold;padding:6px 12px;border-radius:999px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--ink)}
  #stage{position:relative;flex:1;min-height:0}
  canvas#c{width:100%;height:100%;display:block;cursor:grab}
  canvas#c:active{cursor:grabbing}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,253,245,.92);border:2px solid #ff8a3d;border-radius:14px;padding:3px 9px;font-weight:bold;font-size:14px;white-space:nowrap;transform-origin:50% 100%;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .lbl.small{font-size:12px}
  .lbl.animal{font-size:12px;border-color:#2f8f4e;padding:2px 7px}
  .lbl.animal::after{border-top-color:#2f8f4e}
  .lbl:hover{background:#ffd166}
  .lbl::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#ff8a3d}
  .hint{position:absolute;left:12px;bottom:10px;background:rgba(255,253,245,.92);padding:6px 12px;border-radius:12px;font-size:clamp(12px,1.3vw,15px);pointer-events:none}
  #card{position:absolute;left:50%;bottom:16px;transform:translate(-50%,150%);width:min(560px,94%);background:var(--card);border-radius:20px;padding:14px 18px 14px 96px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:4px solid #ffd166;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:6}
  #card.show{transform:translate(-50%,0)}
  #card .pic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:60px;width:76px;text-align:center}
  #card h2{margin:0 0 4px;font-size:clamp(18px,2vw,23px);color:#b54708}
  #card p{margin:0;font-size:clamp(14px,1.55vw,18px);line-height:1.4}
  #card .tools{margin-top:8px}
  #card .tools button{border:0;background:#e9f5ec;border-radius:999px;padding:5px 12px;font:inherit;font-weight:bold;cursor:pointer;color:var(--ink)}
  #card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;cursor:pointer;color:#888}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#8fd3ff,#2c5320);color:#fff;font-size:22px;font-weight:bold;z-index:9;transition:opacity .6s}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .spin{font-size:64px;animation:sp 1.6s linear infinite}
  @keyframes sp{50%{transform:translateY(-12px)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">🏔️ Amazonul în <span>3D</span></h1>
    <a class="btn" id="btn2d" href="index.html">🗺️ Harta 2D</a>
    <a class="btn go" id="btnWalk" href="jungla.html">🚶 Plimbă-te prin junglă</a>
    <button class="btn" id="btnFalls">💦 Cascadele</button>
    <button class="btn" id="btnWhole">🌎 Tot râul</button>
    <button class="btn go" id="btnFly">✈️ Zbor peste râu</button>
    <button class="btn go" id="btnAnimals">🐾 Animalele</button>
    <button class="btn" id="btnRotate">🔄 Rotire</button>
    <div class="meltbox">❄️<input type="range" id="melt" min="0" max="100" value="50">☀️ <span id="meltLbl">Topirea zăpezii</span><button id="btnMeltPlay" title="▶">▶</button></div>
    <button class="btn" id="btnSound">🔇 Sunete</button>
    <div class="lang"><button id="lRO" class="on">RO</button><button id="lEN">EN</button></div>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="hint" id="hint"></div>
    <div id="card">
      <button class="x" id="cardX" aria-label="close">✕</button>
      <div class="pic" id="cardPic">🌿</div>
      <h2 id="cardTitle"></h2>
      <p id="cardText"></p>
      <div class="tools"><button id="btnRead">🔈 Citește-mi</button></div>
    </div>
    <div id="loading"><div class="spin">🏔️💦🌴</div><div id="loadTxt">Se construiesc munții, cascadele și jungla…</div></div>
  </div>
</div>

			// rayleigh coefficients

			vBetaM = totalMie( turbidity ) * mieCoefficient;

		}`,fragmentShader:`
		varying vec3 vWorldPosition;
		varying vec3 vSunDirection;
		varying vec3 vBetaR;
		varying vec3 vBetaM;
		varying float vSunE;

		uniform float cloudScale;
		uniform float cloudSpeed;
		uniform float cloudCoverage;
		uniform float cloudDensity;
		uniform float cloudElevation;

		// gradient at a lattice corner; sinless hash so every GPU produces the same clouds

			float b = dot( gradient( i + vec2( 1.0, 0.0 ) ), f - vec2( 1.0, 0.0 ) );
			float c = dot( gradient( i + vec2( 0.0, 1.0 ) ), f - vec2( 0.0, 1.0 ) );
			float d = dot( gradient( i + vec2( 1.0, 1.0 ) ), f - vec2( 1.0, 1.0 ) );

		// constants for atmospheric scattering

		}

		void main() {

			vec3 direction = normalize( vWorldPosition - cameraPosition );

			// optical length
			// cutoff angle at 90 to avoid singularity in next formula.
			float zenithAngle = acos( max( 0.0, direction.y ) );
			float inverse = 1.0 / ( cos( zenithAngle ) + 0.15 * pow( 93.885 - ( ( zenithAngle * 180.0 ) / pi ), -1.253 ) );
			float sR = rayleighZenithLength * inverse;
			float sM = mieZenithLength * inverse;

			// combined extinction factor
			vec3 Fex = exp( -( vBetaR * sR + vBetaM * sM ) );

			float rPhase = rayleighPhase( cosTheta * 0.5 + 0.5 );

			}

			gl_FragColor = vec4( texColor, 1.0 );

			#include <tonemapping_fragment>
			#include <colorspace_fragment>

		}`};var ev={ro:{title:"\u{1F3D4}\uFE0F Amazonul \xEEn <span>3D</span>",map2d:"\u{1F5FA}\uFE0F Harta 2D",falls:"\u{1F4A6} Cascadele",whole:"\u{1F30E} Tot r\xE2ul",fly:"\u2708\uFE0F Zbor peste r\xE2u",stopfly:"\u23F9 Opre\u0219te zborul",rotate:"\u{1F504} Rotire",animals:"\u{1F43E} Animalele",sound:"Sunete",melt:"Topirea z\u0103pezii",hint:"\u{1F5B1}\uFE0F Trage = rote\u0219ti \xB7 Roti\u021Ba = zoom \xB7 Click dreapta = mu\u021Bi \xB7 Apas\u0103 pe animale!",read:"\u{1F508} Cite\u0219te-mi",loading:"Se construiesc mun\u021Bii, cascadele \u0219i jungla\u2026"},en:{title:"\u{1F3D4}\uFE0F The Amazon in <span>3D</span>",map2d:"\u{1F5FA}\uFE0F 2D Map",falls:"\u{1F4A6} Waterfalls",whole:"\u{1F30E} Whole river",fly:"\u2708\uFE0F Fly over the river",stopfly:"\u23F9 Stop flying",rotate:"\u{1F504} Rotate",animals:"\u{1F43E} Animals",sound:"Sounds",melt:"Snow melting",hint:"\u{1F5B1}\uFE0F Drag = rotate \xB7 Wheel = zoom \xB7 Right-click = move \xB7 Click the animals!",read:"\u{1F508} Read to me",loading:"Building the mountains, the waterfalls and the jungle\u2026"}},Kf={snow:{pic:"\u2744\uFE0F",ro:["Z\u0103pada se tope\u0219te","Pe v\xE2rfurile Mun\u021Bilor Anzi e z\u0103pad\u0103 \u0219i ghea\u021B\u0103 tot anul. C\xE2nd soarele le \xEEnc\u0103lze\u0219te, ele se topesc, iar pic\u0103turile se adun\u0103 \xEEn p\xE2r\xE2ia\u0219e care curg spre cascade. Mut\u0103 bara \u201ETopirea z\u0103pezii\u201D \u0219i vezi ce se \xEEnt\xE2mpl\u0103!"],en:["The snow is melting",'The peaks of the Andes are covered in snow and ice all year. When the sun warms them, they melt and the drops gather into little streams that run to the waterfalls. Move the "Snow melting" slider and see what happens!']},andes:{pic:"\u{1F3D4}\uFE0F",ro:["Mun\u021Bii Anzi","Amazonul se na\u0219te sus, \xEEn Mun\u021Bii Anzi din Peru, la peste 5.000 de metri. Anzii sunt cel mai lung lan\u021B de mun\u021Bi de pe uscat din lume."],en:["The Andes Mountains","The Amazon is born high in the Andes Mountains of Peru, more than 5,000 metres up. The Andes are the longest mountain range on land in the world."]},f0:{pic:"\u{1F4A6}",ro:["Cascada Mara\xF1\xF3n","Mara\xF1\xF3n a fost mult timp considerat izvorul principal al Amazonului. La \xEEnceput curge spre nord, prin canioane foarte ad\xE2nci."],en:["Mara\xF1\xF3n waterfall","For a long time the Mara\xF1\xF3n was thought to be the main source of the Amazon. At first it flows north, through very deep canyons."]},f1:{pic:"\u{1F4A6}",ro:["Cascada Apur\xEDmac","Mul\u021Bi ani s-a spus c\u0103 cel mai \xEEndep\u0103rtat izvor al Amazonului e pe muntele Mismi, de unde porne\u0219te Apur\xEDmac. Apa e rece \u0219i cristalin\u0103."],en:["Apur\xEDmac waterfall","For many years people said the farthest source of the Amazon was on Mount Mismi, where the Apur\xEDmac begins. The water is cold and crystal-clear."]},f2:{pic:"\u{1F4A6}",ro:["Cascada Mantaro","\xCEn 2014, ni\u0219te cercet\u0103tori au m\u0103surat din nou \u0219i au spus c\u0103 poate r\xE2ul Mantaro este, de fapt, cel mai \xEEndep\u0103rtat izvor. Oamenii de \u0219tiin\u021B\u0103 \xEEnc\u0103 discut\u0103!"],en:["Mantaro waterfall","In 2014 some researchers measured again and said the Mantaro River might really be the farthest source. Scientists are still discussing it!"]},merge:{pic:"\u{1F91D}",ro:["Cei trei afluen\u021Bi se unesc","La poalele muntelui, cele trei p\xE2r\xE2uri se unesc \u0219i devin un r\xE2u mare. \xCEn realitate, Mara\xF1\xF3n \u0219i Ucayali se \xEEnt\xE2lnesc l\xE2ng\u0103 ora\u0219ul Nauta, \xEEn Peru, \u0219i de acolo r\xE2ul se nume\u0219te Amazon."],en:["Three streams join together","At the foot of the mountain the three streams join and become one big river. In real life the Mara\xF1\xF3n and the Ucayali meet near the town of Nauta, in Peru, and from there the river is called the Amazon."]},snake:{pic:"\u{1F40D}",ro:["R\xE2ul \xEEncepe s\u0103 \u0219erpuiasc\u0103","Pe c\xE2mpia plat\u0103, apa curge \xEEncet \u0219i sap\u0103 malurile \xEEn curbe, ca un \u0219arpe. Aceste curbe se numesc meandre."],en:["The river starts to snake","On the flat plain the water flows slowly and carves its banks into curves, like a snake. These curves are called meanders."]},japura:{pic:"\u27A1\uFE0F",ro:["Afluentul Japur\xE1","Japur\xE1 vine din Columbia (acolo se nume\u0219te Caquet\xE1) \u0219i se vars\u0103 \xEEn Amazon din partea de nord."],en:["The Japur\xE1 tributary","The Japur\xE1 comes from Colombia (there it is called the Caquet\xE1) and joins the Amazon from the north."]},purus:{pic:"\u3030\uFE0F",ro:["Afluentul Purus","Purus vine din sud \u0219i este unul dintre cele mai \xEEntortocheate r\xE2uri din lume \u2013 face mii de curbe!"],en:["The Purus tributary","The Purus comes from the south and is one of the most winding rivers in the world \u2013 it makes thousands of bends!"]},negro:{pic:"\u2615",ro:["\xCEnt\xE2lnirea apelor \u2013 Manaus","R\xE2ul Negro are apa neagr\u0103 ca ceaiul. La Manaus \xEEnt\xE2lne\u0219te apa maronie, iar cele dou\u0103 curg una l\xE2ng\u0103 alta f\u0103r\u0103 s\u0103 se amestece cam 6 km!"],en:["Meeting of the Waters \u2013 Manaus","The Rio Negro has dark water, like tea. At Manaus it meets the brown water and the two flow side by side without mixing for about 6 km!"]},madeira:{pic:"\u{1FAB5}",ro:["Afluentul Madeira","Madeira este cel mai lung afluent al Amazonului, cam 3.250 km. \u201EMadeira\u201D \xEEnseamn\u0103 \u201Elemn\u201D \xEEn portughez\u0103, pentru c\u0103 pe el plutesc trunchiuri de copaci."],en:["The Madeira tributary",`The Madeira is the Amazon's longest tributary, about 3,250 km. "Madeira" means "wood" in Portuguese, because tree trunks float on it.`]},tapajos:{pic:"\u{1F3D6}\uFE0F",ro:["Afluentul Tapaj\xF3s","Tapaj\xF3s are ap\u0103 limpede, albastru-verzuie, \u0219i plaje cu nisip alb. Se vars\u0103 \xEEn Amazon l\xE2ng\u0103 ora\u0219ul Santar\xE9m."],en:["The Tapaj\xF3s tributary","The Tapaj\xF3s has clear, blue-green water and white sandy beaches. It joins the Amazon near the city of Santar\xE9m."]},xingu:{pic:"\u{1F333}",ro:["Afluentul Xingu","Xingu are ap\u0103 limpede. Pe malurile lui tr\u0103iesc multe popoare indigene, \xEEn Parcul Indigen Xingu, \xEEnfiin\u021Bat \xEEn 1961."],en:["The Xingu tributary","The Xingu has clear water. Many Indigenous peoples live along it, in the Xingu Indigenous Park, created in 1961."]},ocean:{pic:"\u{1F30A}",ro:["V\u0103rsarea \xEEn Oceanul Atlantic","Amazonul aduce at\xE2ta ap\u0103 dulce \xEEnc\xE2t, \xEEn anul 1500, marinarul Vicente Pinz\xF3n a b\u0103ut ap\u0103 dulce departe \xEEn larg \u0219i a numit locul \u201EMarea Dulce\u201D."],en:["Flowing into the Atlantic Ocean",'The Amazon brings so much fresh water that in the year 1500 the sailor Vicente Pinz\xF3n drank fresh water far out at sea and called the place the "Sweet Sea".']},a_jaguar:{pic:"\u{1F406}",ro:["Jaguarul","Cea mai mare pisic\u0103 s\u0103lbatic\u0103 din America. Are o mu\u0219c\u0103tur\u0103 at\xE2t de puternic\u0103 \xEEnc\xE2t poate sparge carapacea unei broa\u0219te \u021Bestoase. Spre deosebire de multe pisici, \xEEi place apa \u0219i \xEEnoat\u0103 foarte bine."],en:["Jaguar","The biggest wild cat in the Americas. Its bite is so strong it can crack a turtle's shell. Unlike many cats, it loves water and is a great swimmer."]},a_capybara:{pic:"\u{1F9AB}",ro:["Capibara","Cel mai mare roz\u0103tor din lume. Are membrane \xEEntre degete, \xEEnoat\u0103 foarte bine \u0219i poate sta sub ap\u0103 cam 5 minute. Tr\u0103ie\u0219te \xEEn familii, l\xE2ng\u0103 r\xE2u."],en:["Capybara","The biggest rodent in the world. It has webbed toes, swims very well and can stay underwater for about 5 minutes. It lives in families near the river."]},a_tapir:{pic:"\u{1F417}",ro:["Tapirul","Cel mai mare animal de uscat din p\u0103durea amazonian\u0103. Are o tromp\u0103 scurt\u0103 cu care apuc\u0103 frunze \u0219i fructe. \xCEnoat\u0103 bine \u0219i r\u0103sp\xE2nde\u0219te semin\u021Bele copacilor prin p\u0103dure."],en:["Tapir","The largest land animal of the Amazon rainforest. It has a short trunk to grab leaves and fruit. It swims well and spreads tree seeds through the forest."]},a_anteater:{pic:"\u{1F41C}",ro:["Furnicarul uria\u0219","Nu are din\u021Bi! Limba lui lung\u0103 de aproape 60 cm prinde furnici \u0219i termite \u2013 poate m\xE2nca zeci de mii \xEEntr-o singur\u0103 zi."],en:["Giant anteater","It has no teeth! Its tongue, almost 60 cm long, catches ants and termites \u2013 it can eat tens of thousands in a single day."]},a_macaw:{pic:"\u{1F99C}",ro:["Papagalii ara","Pot tr\u0103i peste 40 de ani \u0219i zboar\u0103 mereu \xEEn perechi. M\u0103n\xE2nc\u0103 \u0219i lut de pe malul r\xE2ului, care \xEEi ajut\u0103 la digestie."],en:["Macaws","They can live for more than 40 years and always fly in pairs. They even eat clay from the riverbank, which helps their tummies."]},a_toucan:{pic:"\u{1F426}",ro:["Tucanul","Ciocul lui uria\u0219 e u\u0219or, aproape gol pe din\u0103untru, \u0219i \xEEl ajut\u0103 s\u0103 se r\u0103coreasc\u0103 \xEEn c\u0103ldura junglei. Cu el culege fructe din v\xE2rful crengilor."],en:["Toucan","Its huge beak is light, almost hollow inside, and helps it cool down in the jungle heat. It uses it to pick fruit from the ends of branches."]},a_frog:{pic:"\u{1F438}",ro:["Broasca s\u0103geat\u0103-otr\u0103vit\u0103","E mic\u0103 c\xE2t o unghie, dar culorile ei aprinse le spun pr\u0103d\u0103torilor: \u201ENu m\u0103 m\xE2nca, sunt otr\u0103vitoare!\u201D"],en:["Poison dart frog",`It is as small as a fingernail, but its bright colours tell predators: "Don't eat me, I'm poisonous!"`]},a_monkey:{pic:"\u{1F412}",ro:["Maimu\u021Ba url\u0103toare","Strig\u0103tul ei se aude p\xE2n\u0103 la c\xE2\u021Biva kilometri prin p\u0103dure \u2013 e unul dintre cele mai zgomotoase animale de pe uscat! Coada \xEEi ajut\u0103 s\u0103 se aga\u021Be de crengi."],en:["Howler monkey","Its call can be heard several kilometres away through the forest \u2013 it is one of the loudest land animals! Its tail helps it hold on to branches."]},a_hoatzin:{pic:"\u{1F99A}",ro:["Hoa\u021Binul","O pas\u0103re ciudat\u0103: puii au gheare pe aripi, cu care se ca\u021B\u0103r\u0103 \xEEnapoi \xEEn copac dac\u0103 cad \xEEn ap\u0103. M\u0103n\xE2nc\u0103 frunze \u0219i miroase ur\xE2t, de aceea i se spune \u201Epas\u0103rea mirositoare\u201D."],en:["Hoatzin",'A strange bird: its chicks have claws on their wings to climb back into the tree if they fall into the water. It eats leaves and smells bad, so it is called the "stinkbird".']},a_sloth:{pic:"\u{1F9A5}",ro:["Lene\u0219ul","St\u0103 at\xE2rnat cu capul \xEEn jos aproape toat\u0103 via\u021Ba. Se mi\u0219c\u0103 at\xE2t de \xEEncet \xEEnc\xE2t pe blana lui cresc alge verzi. Coboar\u0103 din copac cam o dat\u0103 pe s\u0103pt\u0103m\xE2n\u0103, ca s\u0103 fac\u0103 la toalet\u0103!"],en:["Sloth","It hangs upside down almost all its life. It moves so slowly that green algae grow on its fur. It climbs down about once a week \u2013 to go to the toilet!"]},a_harpy:{pic:"\u{1F985}",ro:["Vulturul harpie","Una dintre cele mai puternice p\u0103s\u0103ri r\u0103pitoare din lume. Ghearele lui sunt mari c\xE2t ale unui urs \u0219i v\xE2neaz\u0103 maimu\u021Be \u0219i lene\u0219i din v\xE2rful copacilor."],en:["Harpy eagle","One of the most powerful birds of prey in the world. Its talons are as big as a bear's claws, and it hunts monkeys and sloths in the treetops."]},a_peccary:{pic:"\u{1F416}",ro:["Pecari cu guler","Seam\u0103n\u0103 cu un porc, dar nu e porc. Tr\u0103iesc \xEEn turme \u0219i se recunosc \xEEntre ei dup\u0103 miros. Au o dung\u0103 alb\u0103 pe g\xE2t, ca un guler."],en:["Collared peccary","It looks like a pig, but it isn't one. Peccaries live in herds and recognise each other by smell. They have a white stripe around the neck, like a collar."]},w_piranha:{pic:"\u{1F41F}",ro:["Piraniile","Au burta ro\u0219ie \u0219i din\u021Bi ascu\u021Bi\u021Bi ca ni\u0219te triunghiuri. \xCEnoat\u0103 \xEEn bancuri ca s\u0103 se apere, nu ca s\u0103 atace. M\u0103n\xE2nc\u0103 pe\u0219ti, insecte \u0219i chiar semin\u021Be."],en:["Piranhas","They have red bellies and teeth sharp as little triangles. They swim in shoals to protect themselves, not to attack. They eat fish, insects and even seeds."]},w_arapaima:{pic:"\u{1F420}",ro:["Arapaima (pirarucu)","Unul dintre cei mai mari pe\u0219ti de ap\u0103 dulce din lume, poate avea 3 metri! Trebuie s\u0103 ias\u0103 la suprafa\u021B\u0103 la c\xE2teva minute ca s\u0103 respire aer."],en:["Arapaima (pirarucu)","One of the biggest freshwater fish in the world \u2013 it can be 3 metres long! It has to come up every few minutes to breathe air."]},w_eel:{pic:"\u26A1",ro:["\u021Aiparul electric","Poate da \u0219ocuri electrice de sute de vol\u021Bi ca s\u0103 se apere \u0219i s\u0103 v\xE2neze. De\u0219i i se spune \u201E\u021Bipar\u201D, e rud\u0103 cu al\u021Bi pe\u0219ti, \u0219i respir\u0103 aer de la suprafa\u021B\u0103."],en:["Electric eel",'It can give electric shocks of hundreds of volts to defend itself and to hunt. Even though it is called an "eel", it is a different kind of fish, and it breathes air at the surface.']},w_anaconda:{pic:"\u{1F40D}",ro:["Anaconda verde","Cel mai greu \u0219arpe din lume, poate dep\u0103\u0219i 5 metri. St\u0103 mult \xEEn ap\u0103, unde e greu de v\u0103zut \u2013 doar ochii \u0219i n\u0103rile \xEEi ies deasupra."],en:["Green anaconda","The heaviest snake in the world \u2013 it can be longer than 5 metres. It spends a lot of time in water, where it is hard to see \u2013 only its eyes and nostrils stick out."]},w_caiman:{pic:"\u{1F40A}",ro:["Caimanul negru","Rud\u0103 cu crocodilul, poate dep\u0103\u0219i 4 metri. Are ochii \u0219i n\u0103rile \xEEn v\xE2rful capului, a\u0219a c\u0103 poate p\xE2ndi st\xE2nd aproape complet sub ap\u0103."],en:["Black caiman","A relative of the crocodile that can grow longer than 4 metres. Its eyes and nostrils are on top of its head, so it can wait almost complete
